name: Deploy LearnInclusive

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: learninclusive-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_PROJECT_ID: ittuorfjrmktmjwwmgad

jobs:
  validate:
    name: Validate frontend and Supabase project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        env:
          VITE_SUPABASE_URL: https://ittuorfjrmktmjwwmgad.supabase.co
          VITE_SUPABASE_PROJECT_ID: ittuorfjrmktmjwwmgad
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

  deploy-supabase:
    name: Deploy database and Edge Functions
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase projects list >/dev/null

      - name: Preview database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase db push --project-ref "$SUPABASE_PROJECT_ID" --dry-run

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase db push --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Verify deployed Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID"

  deploy-frontend:
    name: Deploy frontend to Ubuntu
    needs:
      - validate
      - deploy-supabase
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://learn.smilekisan.com

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/learninclusive_deploy"
          chmod 600 "$HOME/.ssh/learninclusive_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/learninclusive_deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="/opt/learninclusive"
          cd "$APP_DIR"

          echo "==> Syncing main branch"
          git fetch --prune origin main
          git reset --hard origin/main

          test -f .env.production || {
            echo "ERROR: $APP_DIR/.env.production is missing"
            exit 1
          }

          echo "==> Building LearnInclusive image"
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.production.yml \
            --env-file .env.production \
            build --pull

          echo "==> Starting LearnInclusive"
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.production.yml \
            --env-file .env.production \
            up -d --remove-orphans

          echo "==> Verifying port isolation"
          test "$(docker port learninclusive-production 80/tcp)" = "127.0.0.1:8081"

          echo "==> Waiting for container health"
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' learninclusive-production 2>/dev/null || true)

            if [ "$STATUS" = "healthy" ]; then
              echo "LearnInclusive is healthy."
              break
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "LearnInclusive became unhealthy."
              docker logs --tail 100 learninclusive-production || true
              exit 1
            fi

            sleep 2
          done

          STATUS=$(docker inspect --format='{{.State.Health.Status}}' learninclusive-production 2>/dev/null || true)
          test "$STATUS" = "healthy" || {
            echo "Timed out waiting for LearnInclusive health check."
            docker ps --filter name=learninclusive-production
            docker logs --tail 100 learninclusive-production || true
            exit 1
          }

          echo "==> Local HTTP smoke test"
          curl --fail --silent --show-error --head http://127.0.0.1:8081 >/dev/null

          echo "==> Production deployment complete"
          REMOTE
