services:
  learninclusive:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${LEARNINCLUSIVE_HOST_PORT:-18080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3